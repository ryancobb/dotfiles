# The cozy cabin palette: the one source for the Quartz claude-code theme, the
# Ghostty theme that cmux reads, the nvim nightfox palette, the Claude Code
# theme, and the cmux accent. Edit a color here, then run `cozycabin-apply`:
# it renders quartz/_cozycabin.scss, applies the chezmoi templates that read
# .cozycabin.*, reloads cmux, and restarts a running Quartz server.
cozycabin:
  # Surfaces: smoked walnut, darkest first. Warmer browns (+0.010 and +0.016
  # OKLCH chroma on the ember's hue) were tried on 2026-10-20 and rejected.
  bg0: "#1b1815" # status line, floats, the Claude Code composer sidebar
  bg1: "#221e1b" # the background
  bg2: "#2b2622" # folds, the Claude Code user message
  bg3: "#37312c" # cursor line; terminal black
  bg4: "#625850" # borders, conceal; terminal bright black

  # Text: cream. 2026-10-20: fg0, fg1, and white warmed to OKLCH C ~0.035
  # (from ~0.023) and hue 69 (from 75), toward the ember, at the same
  # lightness; was #e4d9ca, #dcd0c0, #ebe1d3.
  fg0: "#ebd7c2" # nvim only, between fg1 and white (Quartz has no fg0)
  fg1: "#e2ceb9" # the foreground
  fg2: "#b5a998" # status line text
  fg3: "#8f8476" # line numbers, inactive text
  white: "#f2dfcb" # terminal bright white
  comment: "#857a6d"
  punct: "#9a8e80" # Quartz code punctuation and operators

  # Selections.
  sel_faint: "#2b2521" # Quartz --vt-sel0: 3 points off bg1, too faint for a terminal
  sel: "#4d3d33" # Quartz --vt-sel1; the terminal selection, nvim Visual, Claude Code selectionBg
  sel_search: "#675041" # nvim popup selection and search: an ember step above sel

  # Hues, base and bright: the terminal's normal and bright colors, nightfox's
  # base and bright shades, and the Claude Code accents. 2026-10-20: OKLCH
  # chroma halfway between the first cut and a 55% pull toward 0.12, at the
  # same lightness and hue (the first cut read as grey in Claude Code; the
  # 55% pull was too saturated in the terminal and nvim); the Quartz site
  # keeps the first cut under `quartz:` below. Later on 2026-10-20 the
  # ember (orange and orange_bright) went to C 0.12 and 0.11 at the same
  # lightness and hue, from 0.090 and 0.081, as it read as faded on the
  # Claude Code mascot; was #d49a70 and #e4b088. Red (and red_bright)
  # followed on 2026-10-20: C 0.12 and 0.11 at the same lightness, hue 30,
  # from 0.086 and 0.079, as errors were quieter than the ember and too close
  # to pink (ΔE 4.6, now 6.5); was #cb887a and #dd9d91. Magenta (and
  # magenta_bright) went to hue 320 and C 0.065 and 0.062 the same day, at
  # the same lightness, from hue 344 and C 0.055 and 0.052, toward purple and
  # away from pink (ΔE 4.4, now 6.8); was #bb94aa and #cea8bc.
  red: "#dc7d6f" # worn flannel
  red_bright: "#ed9487"
  orange: "#e1945a" # ember: the accent
  orange_bright: "#f1ab73"
  yellow: "#d2b177" # lamp honey
  yellow_bright: "#e0c48e"
  green: "#a4ad79" # dusty moss
  green_bright: "#b8bf8e"
  blue: "#86a6bc" # dusk smoke
  blue_bright: "#9ab9cf"
  magenta: "#b494bb" # heather
  magenta_bright: "#c8a8cd"
  cyan: "#81ad95" # pine
  cyan_bright: "#98c0a8"
  pink: "#d19598"
  pink_bright: "#dca3a6"

  # The Quartz site keeps the muted first cut of the hues: it shows color in
  # wide heading bands and link chips, where the terminal's stronger hues read
  # as too saturated (rcobb, 2026-10-20). Only _cozycabin.scss reads these.
  quartz:
    red: "#c48b80"
    red_bright: "#d4a197"
    orange: "#cf9c78"
    orange_bright: "#ddb292"
    yellow: "#cdb282"
    yellow_bright: "#dbc59b"
    green: "#a4ab85"
    green_bright: "#b8bd9c"
    blue: "#95a3ad"
    blue_bright: "#aab6bf"
    magenta: "#b09aa6"
    magenta_bright: "#c2aeb8"
    cyan: "#8fa89a"
    cyan_bright: "#a6bbae"
    pink: "#c79a9c"

  # Claude Code colors no other consumer uses. The diff backgrounds are their
  # own greens and reds (OKLCH L 0.30/0.295 C 0.019/0.024 at hues 142/22;
  # dimmed L 0.26/0.255 C 0.015/0.015, word marks L 0.36/0.355 C 0.028/0.034):
  # blends of the pastel hues over bg1 came out as two browns (2026-10-20).
  # The first greens and reds were cut to 50% chroma the same day as too
  # saturated, then to 60% of that as still jarring, then darkened from L
  # 0.39/0.38 (dimmed 0.32/0.31, word marks 0.50/0.48) in two steps: the
  # bright bands were the jar. The message backgrounds
  # are faint tints of pink (bash) and magenta (memory) over bg1, picked at 12%;
  # they are values of their own, and a small hue edit does not move them.
  # Claude Code draws diffs in 256 colors under the dark-ansi base, so a hex
  # there rounds to the nearest xterm color, and these all rounded to greys
  # (2026-10-20). The theme names a 256-color slot for each diff color and
  # the Ghostty theme paints the slot with it. Each slot's stock color is a
  # green or red of the same rank, so a terminal without this palette still
  # shows green and red. The cost: another program that prints text in these
  # slots (256-color green 28 and 34, red 88 and 124) draws it at 1.2 to 1.5:1
  # on bg1, close to invisible; none of the dotfiles do today.
  claude_code:
    diff_added: "#293027"
    diff_removed: "#382827"
    diff_added_dimmed: "#20261f"
    diff_removed_dimmed: "#2a2020"
    diff_added_word: "#344134"
    diff_removed_word: "#4c3534"
    diff_slots:
      diff_added_dimmed: 22
      diff_added: 28
      diff_added_word: 34
      diff_removed_dimmed: 52
      diff_removed: 88
      diff_removed_word: 124
    bash_message_bg: "#372c2a"
    memory_bg: "#342c2c"
